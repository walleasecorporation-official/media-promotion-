<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>청소년 이용약관</title>

    <!-- PWA: 매니페스트/아이콘은 실제 파일로 제공해야 설치 가능 판정을 받습니다 -->
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="description" content="밀알 영상제 출품작 · 청소년 이용약관">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="약관동의">
    <meta name="format-detection" content="telephone=no">


    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --label: #000000;
            --label-2: rgba(60, 60, 67, .6);
            --label-3: rgba(60, 60, 67, .3);
            --separator: rgba(60, 60, 67, .29);
            --blue: #007aff;
            --red: #ff3b30;
            --green: #34c759;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --ease-ios: cubic-bezier(.2, .8, .2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: #1c1c1e;
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        #mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            background-color: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, .5);
        }

        .hidden {
            display: none !important;
        }

        /* ================= 화면 공통 ================= */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation;
        }

        .screen.active {
            display: flex;
        }

        /* ---- #S1 : 검은 바탕 위의 동의 팝업 ---- */
        #screen-consent {
            background: #000;
            justify-content: center;
            align-items: center;
        }

        /* ---- 약관 화면 (iOS 설정 앱 스타일) ---- */
        #screen-terms {
            background: var(--ios-bg);
            color: var(--label);
        }

        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: calc(var(--safe-top) + 18px) 16px 14px;
            text-align: center;
            background: rgba(249, 249, 249, .86);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: .5px solid var(--separator);
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.2px;
        }

        .terms-body {
            flex: 1;
            padding: 22px 16px calc(var(--safe-bottom) + 90px);
            transition: opacity .5s ease;
        }

        /* 조항 카드 */
        .clause {
            background: var(--ios-card);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .55s var(--ease-ios), transform .55s var(--ease-ios);
            position: relative;
        }

        .clause.show {
            opacity: 1;
            transform: none;
        }

        .clause-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .clause-no {
            font-size: 13px;
            font-weight: 600;
            color: var(--label-2);
            letter-spacing: .3px;
        }

        .clause-lock {
            width: 18px;
            height: 18px;
            color: var(--label-2);
            opacity: 0;
            transform: scale(.6);
            transition: opacity .35s ease, transform .35s var(--ease-ios);
        }

        .clause.locked .clause-lock {
            opacity: 1;
            transform: scale(1);
        }

        .clause.locked.unmet .clause-lock {
            color: var(--red);
        }

        .clause-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 17px;
            line-height: 1.5;
        }

        .clause-box {
            flex: none;
            width: 20px;
            height: 20px;
            margin-top: 3px;
            border-radius: 5px;
            border: 1.6px solid #c7c7cc;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .25s ease, border-color .25s ease;
        }

        .clause-box svg {
            width: 13px;
            height: 13px;
            opacity: 0;
        }

        .clause.met .clause-box {
            background: var(--blue);
            border-color: var(--blue);
        }

        .clause.met .clause-box svg {
            opacity: 1;
        }

        .clause.unmet .clause-box {
            border-color: var(--red);
        }

        .clause-text {
            flex: 1;
            min-width: 0;
            word-break: keep-all;
        }

        /* 빨간 취소선: 인라인 배경을 늘려서 줄바꿈된 문장에도 왼쪽부터 그어진다 */
        .strike {
            background-image: linear-gradient(var(--red), var(--red));
            background-repeat: no-repeat;
            background-position: 0 58%;
            background-size: 0% 2px;
            transition: background-size .9s cubic-bezier(.6, .05, .3, 1), color .6s ease .3s;
        }

        .clause.unmet .strike {
            background-size: 100% 2px;
            color: rgba(60, 60, 67, .55);
        }

        .verdict {
            display: inline-block;
            margin-left: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--red);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity .4s ease .75s, transform .4s var(--ease-ios) .75s;
            white-space: nowrap;
        }

        .clause.met .verdict {
            color: var(--blue);
        }

        .clause.unmet .verdict,
        .clause.met .verdict {
            opacity: 1;
            transform: none;
        }

        /* #S13: 상태를 카드 하단에 배지로 표시 */
        .clause-status {
            display: none;
            justify-content: flex-end;
            margin-top: 10px;
            padding-top: 10px;
            border-top: .5px solid var(--separator);
        }

        .status-mode .clause-status {
            display: flex;
        }

        .status-mode .verdict {
            display: none;
        }

        .status-pill {
            font-size: 12.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            color: var(--red);
            background: rgba(255, 59, 48, .12);
        }

        .clause.met .status-pill {
            color: #1f8f3a;
            background: rgba(52, 199, 89, .15);
        }

        .terms-summary {
            margin: 6px 4px 0;
            font-size: 13px;
            color: var(--label-2);
            text-align: right;
            opacity: 0;
            transition: opacity .5s ease;
        }

        .terms-summary.show {
            opacity: 1;
        }

        .terms-summary b {
            color: var(--red);
        }

        /* ---- #S17 : 검정 바탕 반전 ---- */
        .invert-box {
            position: relative;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .invert-box .invert-fill {
            position: absolute;
            inset: 0;
            background: #000;
            clip-path: inset(0 100% 0 0);
            transition: clip-path .9s cubic-bezier(.7, 0, .2, 1);
        }

        .invert-box .invert-content {
            position: relative;
            padding: 16px 14px;
            text-align: center;
            color: var(--red);
            opacity: 0;
        }

        .invert-box.on .invert-fill {
            clip-path: inset(0 0 0 0);
        }

        .invert-box.on .invert-content {
            animation: glitchIn .9s steps(1, end) .8s forwards;
        }

        .invert-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: rgba(255, 59, 48, .8);
            margin-bottom: 4px;
        }

        .invert-value {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -.5px;
            text-shadow: 0 0 18px rgba(255, 59, 48, .45);
        }

        @keyframes glitchIn {
            0% { opacity: 1; transform: translateX(-4px); filter: blur(1px); }
            15% { opacity: 0; }
            30% { opacity: 1; transform: translateX(3px); }
            45% { opacity: .2; }
            60% { opacity: 1; transform: translateX(-1px); filter: none; }
            100% { opacity: 1; transform: none; }
        }

        /* 반전 순간 화면 전체가 한 번 번쩍인다 */
        #screen-terms.inverted-flash {
            animation: invFlash .5s ease;
        }

        @keyframes invFlash {
            0% { filter: none; }
            30% { filter: invert(1); }
            100% { filter: none; }
        }

        /* ---- #S18 : 오늘의 평가 ---- */
        .eval-head {
            text-align: center;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 10px 0 22px;
            opacity: 0;
            transition: opacity .5s ease;
        }

        .eval-head.show {
            opacity: 1;
        }

        .eval-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--ios-card);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: 700;
            color: var(--red);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .45s ease, transform .45s var(--ease-ios);
        }

        .eval-item::before {
            content: "";
            flex: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
        }

        .eval-item.minor {
            font-size: 15px;
            font-weight: 600;
            padding: 10px 16px;
            color: rgba(255, 59, 48, .75);
        }

        .eval-item.show {
            opacity: 1;
            transform: none;
        }

        .eval-more {
            width: 2px;
            height: 0;
            margin: 6px auto 0;
            background-image: linear-gradient(var(--red) 50%, transparent 50%);
            background-size: 2px 8px;
            opacity: .6;
            transition: height 1.6s linear;
        }

        .eval-more.show {
            height: 120px;
        }

        /* ================= 아이폰 잠금화면 ================= */
        .lock-layer {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: none;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
            touch-action: none;
            will-change: transform;
            background:
                radial-gradient(120% 70% at 20% 0%, #3b3f8f 0%, transparent 60%),
                radial-gradient(110% 80% at 100% 100%, #7a2e5d 0%, transparent 55%),
                linear-gradient(180deg, #14162e 0%, #0b0b14 100%);
        }

        .lock-layer.night {
            background:
                radial-gradient(120% 70% at 30% 0%, #1c2350 0%, transparent 60%),
                radial-gradient(110% 80% at 100% 100%, #2b1430 0%, transparent 55%),
                linear-gradient(180deg, #07080f 0%, #000 100%);
        }

        .lock-layer.active {
            display: flex;
        }

        .lock-layer.dragging {
            transition: none !important;
        }

        .lock-layer.release {
            transition: transform .45s var(--ease-ios), opacity .45s ease;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(var(--safe-top) + 12px) 26px 0;
            font-size: 15px;
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .status-icons svg {
            height: 12px;
            width: auto;
            fill: #fff;
        }

        .lock-top {
            text-align: center;
            margin-top: 18px;
        }

        .lock-top .lock-icon {
            width: 16px;
            height: 20px;
            fill: #fff;
            opacity: .9;
        }

        .lock-date {
            margin-top: 6px;
            font-size: 19px;
            font-weight: 600;
            opacity: .9;
        }

        .lock-time {
            font-size: min(24vw, 96px);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, .25);
        }

        .lock-notis {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 8px;
            padding: 20px 10px 10px;
            overflow: hidden;
        }

        .noti {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            width: 100%;
            text-align: left;
            color: #fff;
            border: none;
            background: rgba(40, 40, 46, .55);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-radius: 20px;
            padding: 12px 14px;
            opacity: 0;
            transform: translateY(24px) scale(.96);
            transition: transform .15s ease;
        }

        .noti.show {
            animation: notiIn .55s var(--ease-ios) forwards;
        }

        .noti.tappable:active {
            transform: scale(.97);
        }

        @keyframes notiIn {
            0% { opacity: 0; transform: translateY(24px) scale(.96); }
            70% { opacity: 1; transform: translateY(-2px) scale(1.005); }
            100% { opacity: 1; transform: none; }
        }

        .noti-icon {
            flex: none;
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .noti-main {
            flex: 1;
            min-width: 0;
        }

        .noti-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        .noti-time {
            flex: none;
            font-size: 13px;
            font-weight: 400;
            opacity: .6;
        }

        .noti-body {
            font-size: 15px;
            line-height: 1.35;
            opacity: .92;
            margin-top: 1px;
            word-break: keep-all;
        }

        .lock-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 44px 0;
        }

        .lock-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, .16);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .lock-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        .swipe-hint {
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            padding: 14px 0 6px;
            color: rgba(255, 255, 255, .75);
            opacity: 0;
            transition: opacity .5s ease;
            cursor: pointer;
        }

        .swipe-hint.show {
            opacity: 1;
            animation: hintPulse 1.8s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { transform: translateY(0); opacity: .45; }
            50% { transform: translateY(-5px); opacity: 1; }
        }

        .home-indicator {
            width: 134px;
            height: 5px;
            border-radius: 3px;
            background: #fff;
            margin: 8px auto calc(var(--safe-bottom) + 8px);
        }

        /* ================= iOS 알림창 (Alert) ================= */
        .alert-layer {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            background: rgba(0, 0, 0, .32);
            opacity: 0;
            transition: opacity .25s ease;
        }

        .alert-layer.dark-bg {
            background: rgba(0, 0, 0, 0);
        }

        .alert-layer.active {
            display: flex;
        }

        .alert-layer.show {
            opacity: 1;
        }

        .ios-alert {
            width: 270px;
            max-width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(242, 242, 242, .9);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            text-align: center;
            transform: scale(1.12);
            transition: transform .3s var(--ease-ios);
        }

        .alert-layer.show .ios-alert {
            transform: scale(1);
        }

        .ios-alert.shake {
            animation: shake .45s cubic-bezier(.36, .07, .19, .97) both;
        }

        .alert-text {
            padding: 20px 16px 18px;
        }

        .alert-title {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.35;
            color: #000;
            word-break: keep-all;
        }

        .alert-msg {
            margin-top: 4px;
            font-size: 13px;
            line-height: 1.4;
            color: #000;
            word-break: keep-all;
        }

        .alert-msg:empty {
            display: none;
        }

        .alert-btns {
            display: flex;
            border-top: .5px solid rgba(60, 60, 67, .36);
        }

        .alert-btns button {
            flex: 1;
            min-height: 44px;
            border: none;
            background: transparent;
            color: var(--blue);
            font-size: 17px;
            touch-action: manipulation;
            transition: background .12s ease;
        }

        .alert-btns button + button {
            border-left: .5px solid rgba(60, 60, 67, .36);
        }

        .alert-btns button.primary {
            font-weight: 600;
        }

        .alert-btns button:active {
            background: rgba(0, 0, 0, .08);
        }

        .alert-btns button:disabled {
            pointer-events: none;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
            40%, 60% { transform: translate3d(7px, 0, 0); }
        }

        .alert-toast {
            position: absolute;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 70px);
            transform: translate(-50%, 10px);
            z-index: 70;
            background: rgba(30, 30, 30, .9);
            color: #fff;
            font-size: 13.5px;
            padding: 10px 16px;
            border-radius: 999px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease, transform .3s var(--ease-ios);
        }

        .alert-toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ================= 시스템 오류 ================= */
        .error-layer {
            position: absolute;
            inset: 0;
            z-index: 65;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 30px;
            background: rgba(255, 255, 255, .96);
        }

        .error-layer.active {
            display: flex;
        }

        .error-layer.on {
            animation: errBg .9s ease;
        }

        @keyframes errBg {
            0% { background: rgba(255, 59, 48, .55); }
            100% { background: rgba(255, 255, 255, .96); }
        }

        .error-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--red);
            margin-bottom: 18px;
            letter-spacing: -.3px;
        }

        .error-box {
            width: 100%;
            max-width: 300px;
            min-height: 120px;
            border: 2px solid #1c1c1e;
            border-radius: 6px;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
        }

        .error-box .err-icon {
            width: 34px;
            height: 34px;
            fill: var(--red);
        }

        .error-box .err-msg {
            font-size: 14px;
            color: #3a3a3c;
            line-height: 1.45;
            word-break: keep-all;
        }

        .error-box .err-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px;
            color: var(--red);
            letter-spacing: .5px;
        }

        .error-layer.on .error-box,
        .error-layer.on .error-title {
            animation: shake .45s cubic-bezier(.36, .07, .19, .97) both;
        }

        /* 3번째 오류에서 쏟아지는 창들 */
        .err-clone {
            position: absolute;
            width: 220px;
            padding: 14px;
            border: 2px solid #1c1c1e;
            border-radius: 6px;
            background: #fff;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--red);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
            animation: popIn .18s ease-out both;
        }

        @keyframes popIn {
            from { transform: scale(.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ================= 새로고침 연출 ================= */
        .reload-layer {
            position: absolute;
            inset: 0;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .reload-layer.active {
            display: flex;
        }

        .reload-bar {
            position: absolute;
            top: var(--safe-top);
            left: 0;
            height: 3px;
            width: 0;
            background: var(--blue);
        }

        .reload-layer.run .reload-bar {
            transition: width 1.8s cubic-bezier(.3, .6, .4, 1);
            width: 100%;
        }

        .spinner {
            width: 30px;
            height: 30px;
            position: relative;
            animation: spin 1s steps(8) infinite;
        }

        .spinner i {
            position: absolute;
            left: 13.5px;
            top: 0;
            width: 3px;
            height: 9px;
            border-radius: 2px;
            background: #8e8e93;
            transform-origin: 1.5px 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ================= 암전 / 엔딩 ================= */
        #black-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #black-overlay.block {
            pointer-events: auto;
        }

        #end-text {
            position: absolute;
            inset: 0;
            z-index: 110;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 0 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2.4s ease;
            text-align: center;
        }


            font-size: 11.5px;
            color: rgba(255, 255, 255, .34);
            line-height: 1.7;
            word-break: keep-all;
        }

        /* 화면 하단 안내 문구 */
        .tap-guide {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(var(--safe-bottom) + 24px);
            text-align: center;
            font-size: 12.5px;
            letter-spacing: .5px;
            color: var(--label-2);
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s ease;
            z-index: 6;
        }

        .tap-guide.show {
            animation: guidePulse 1.6s ease-in-out infinite;
        }

        @keyframes guidePulse {
            0%, 100% { opacity: .3; }
            50% { opacity: .85; }
        }

        /* ---- 앱 설치 배너 ----
           position:fixed 로 두어야 컨테이너가 스크롤돼도 화면 하단에 고정된다.
           (absolute 였을 때는 스크롤 콘텐츠와 함께 밀려 올라가 보이지 않는 경우가 있었음) */
        #install-banner {
            position: fixed;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 12px);
            width: min(406px, calc(100% - 24px));
            z-index: 500;
            /* 1번 화면이 검정이라 표면을 한 단계 올려야 배너가 떠 보인다 */
            background: rgba(44, 44, 46, .96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 16px;
            padding: 12px 12px 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translate(-50%, calc(100% + var(--safe-bottom) + 28px));
            transition: transform .5s cubic-bezier(.2, .8, .2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
        }

        #install-banner.show {
            transform: translate(-50%, 0);
        }

        #install-banner img {
            width: 44px;
            height: 44px;
            border-radius: 11px;
            flex: none;
        }

        #install-banner .ib-txt {
            flex: 1;
            min-width: 0;
            color: #fff;
        }

        #install-banner .ib-title {
            font-size: 13.5px;
            font-weight: 700;
            margin-bottom: 2px;
            word-break: keep-all;
        }

        #install-banner .ib-sub {
            font-size: 11.5px;
            /* 작은 글씨라 명도 대비를 높였다 (#8e8e93 -> 흰색 62%) */
            color: rgba(255, 255, 255, .62);
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 터치 타겟은 최소 44px (iOS HIG / Material 접근성 기준) */
        #install-banner .ib-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 11px;
            min-height: 44px;
            padding: 0 15px;
            font-size: 13.5px;
            font-weight: 700;
            white-space: nowrap;
            flex: none;
            touch-action: manipulation;
            transition: transform .15s ease, opacity .15s ease;
        }

        /* tap-highlight 를 껐기 때문에 :active 로 눌린 느낌을 직접 준다 */
        #install-banner .ib-btn:active {
            transform: scale(.94);
            opacity: .82;
        }

        #install-banner .ib-btn[disabled] {
            opacity: .55;
        }

        #install-banner .ib-close {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, .55);
            font-size: 16px;
            line-height: 1;
            width: 44px;
            height: 44px;
            margin-right: -8px;
            flex: none;
            touch-action: manipulation;
            transition: transform .15s ease;
        }

        #install-banner .ib-close:active {
            transform: scale(.86);
        }

        /* ---- 설치 안내 시트 (iOS / 인앱 브라우저 / 기타 브라우저 공용) ---- */
        #install-sheet {
            position: fixed;
            inset: 0;
            z-index: 600;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        #install-sheet.show {
            display: flex;
        }

        #install-sheet .sheet-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            animation: sheetFade .25s ease forwards;
        }

        #install-sheet .sheet {
            position: relative;
            width: min(430px, 100%);
            max-height: 86dvh;
            overflow-y: auto;
            background: #2c2c2e;
            border-top: 1px solid rgba(255, 255, 255, .12);
            border-radius: 20px 20px 0 0;
            padding: 10px 20px calc(var(--safe-bottom) + 16px);
            color: #fff;
            animation: sheetUp .32s cubic-bezier(.2, .8, .2, 1) forwards;
        }

        @keyframes sheetFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes sheetUp {
            from { transform: translateY(18px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #install-sheet .sheet-grabber {
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, .22);
            margin: 0 auto 16px;
        }

        #install-sheet .sheet h3 {
            font-size: 16.5px;
            line-height: 1.45;
            margin-bottom: 14px;
            word-break: keep-all;
        }

        #install-sheet .sheet ol {
            margin: 0 0 4px 18px;
            font-size: 14px;
            line-height: 1.9;
            color: #e5e5e5;
            word-break: keep-all;
        }

        #install-sheet .sheet button {
            margin-top: 12px;
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            touch-action: manipulation;
            transition: transform .15s ease, opacity .15s ease;
        }

        #install-sheet .sheet button:active {
            transform: scale(.98);
            opacity: .85;
        }

        #install-sheet .sheet-primary {
            background: #fff;
            color: #000;
        }

        #install-sheet .sheet-secondary {
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }

        /* 설치 UI 의 움직임만 줄인다 (작품 본편 연출은 그대로 유지) */
        @media (prefers-reduced-motion: reduce) {
            #install-banner {
                transition-duration: .01ms;
            }

            #install-sheet .sheet,
            #install-sheet .sheet-backdrop {
                animation-duration: .01ms;
            }
        }

        /* ---- 스크롤바 숨김 ---- */
        * { scrollbar-width: none; -ms-overflow-style: none; }
        ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    </style>
</head>

<body>
    <div id="mobile-container">

        <!-- #S1 : 기본 동의 팝업 (검은 바탕 + 알림창 레이어 사용) -->
        <section id="screen-consent" class="screen active" aria-label="동의 확인"></section>

        <!-- #S11 ~ #S18 : 청소년 이용약관 화면 (내용은 스크립트가 단계별로 그린다) -->
        <section id="screen-terms" class="screen" aria-label="청소년 이용약관">
            <header class="nav-bar">
                <div class="nav-title">청소년 이용약관</div>
            </header>
            <div class="terms-body" id="terms-body"></div>
        </section>

        <!-- #S17 / #S18 : 아이폰 잠금화면 -->
        <section id="lock-screen" class="lock-layer" aria-label="잠금화면">
            <div class="status-bar">
                <span>SKT</span>
                <span class="status-icons" aria-hidden="true">
                    <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                    <svg viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.3-1.4A10.3 10.3 0 0 0 8 .6C5.2.6 2.6 1.7.7 3.6L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.8c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.8 6.8 0 0 0 8 4.4c-1.8 0-3.5.7-4.7 1.9l1.3 1.4C5.5 6.9 6.7 6.4 8 6.4Zm0 3.6 2-2.1a2.9 2.9 0 0 0-4 0Z"/></svg>
                    <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="1.6"/><path d="M24 4v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" fill-opacity=".5"/></svg>
                </span>
            </div>
            <div class="lock-top">
                <svg class="lock-icon" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 0a5 5 0 0 0-5 5v3H2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V5a5 5 0 0 0-5-5Zm-3 5a3 3 0 1 1 6 0v3H5V5Z"/></svg>
                <div class="lock-date" id="lock-date"></div>
                <div class="lock-time" id="lock-time">23:02</div>
            </div>
            <div class="lock-notis" id="lock-notis"></div>
            <div class="swipe-hint" id="swipe-hint">위로 쓸어올려 열기</div>
            <div class="lock-bottom" aria-hidden="true">
                <span class="lock-btn"><svg viewBox="0 0 24 24"><path d="M8 2h8l-1 5H9L8 2Zm1 6h6v13a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V8Zm3 4a1.3 1.3 0 1 0 0 2.6A1.3 1.3 0 0 0 12 12Z"/></svg></span>
                <span class="lock-btn"><svg viewBox="0 0 24 24"><path d="M9 4 7.6 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.6L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg></span>
            </div>
            <div class="home-indicator"></div>
        </section>

        <!-- iOS 알림창 -->
        <div class="alert-layer" id="alert-layer" role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
            <div class="ios-alert" id="ios-alert">
                <div class="alert-text">
                    <div class="alert-title" id="alert-title"></div>
                    <div class="alert-msg" id="alert-msg"></div>
                </div>
                <div class="alert-btns">
                    <button type="button" class="primary" id="alert-yes">예</button>
                    <button type="button" id="alert-no">아니요</button>
                </div>
            </div>
        </div>
        <div class="alert-toast" id="alert-toast" role="status"></div>

        <!-- 시스템 오류 -->
        <div class="error-layer" id="error-layer" role="alert">
            <div class="error-title">오류가 발생했습니다</div>
            <div class="error-box">
                <svg class="err-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 21h22L12 2Zm-1 7h2v6h-2V9Zm0 8h2v2h-2v-2Z"/></svg>
                <div class="err-msg">요청을 처리할 수 없습니다.<br>잠시 후 다시 시도해 주세요.</div>
                <div class="err-code" id="err-code"></div>
            </div>
        </div>

        <!-- 새로고침 -->
        <div class="reload-layer" id="reload-layer" aria-hidden="true">
            <div class="reload-bar"></div>
            <div class="spinner" id="spinner"></div>
        </div>

        <div class="tap-guide" id="tap-guide">화면을 눌러 계속하기</div>
        <div id="black-overlay"></div>
        <div id="end-text">
            <p class="help-note">힘든 순간이 있다면 혼자 견디지 않아도 됩니다.<br>청소년 상담 1388 · 정신건강 위기상담 1577-0199</p>
        </div>


        <div id="install-banner" role="region" aria-label="앱 설치 안내" aria-hidden="true">
            <img id="install-icon" src="./icons/icon-192.png" width="44" height="44" alt="" decoding="async">
            <div class="ib-txt">
                <div class="ib-title" id="ib-title">앱으로 설치하기</div>
                <div class="ib-sub" id="ib-sub">설치하고 알림도 받아보세요</div>
            </div>
            <button class="ib-btn" id="ib-install" type="button">설치</button>
            <button class="ib-close" id="ib-close" type="button" aria-label="설치 안내 닫기">✕</button>
        </div>

        <div id="install-sheet" role="dialog" aria-modal="true" aria-labelledby="isheet-title" aria-hidden="true">
            <div class="sheet-backdrop" id="isheet-backdrop"></div>
            <div class="sheet">
                <div class="sheet-grabber" aria-hidden="true"></div>
                <h3 id="isheet-title"></h3>
                <ol id="isheet-steps"></ol>
                <button type="button" class="sheet-primary hidden" id="isheet-action"></button>
                <button type="button" class="sheet-secondary" id="isheet-close">확인했어요</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            "use strict";

            // ---------- 아이콘 / 매니페스트 ----------
            // 아이콘과 매니페스트는 실제 파일로 제공한다.
            // base64 data: URI 로 내장하면 브라우저가 아이콘을 검증하지 못해
            // "설치 가능(installable)" 판정을 받지 못하는 경우가 있다.
            const ICON_192_URI = new URL("./icons/icon-192.png", location.href).href;

            // ---------- SERVICE WORKER ----------
            // fetch 핸들러를 가진 sw.js 가 등록되어 있어야 Chromium 계열에서 설치가 가능하고,
            // 설치 후 오프라인에서도 앱이 열린다.
            let swReady = null;
            if ("serviceWorker" in navigator && location.protocol !== "file:") {
                swReady = navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => null);
            }

            function sendNotification(title, body, opts) {
                opts = opts || {};
                if (!("Notification" in window) || Notification.permission !== "granted") {
                    return Promise.resolve(false);
                }
                if (!("serviceWorker" in navigator)) return Promise.resolve(false);
                return navigator.serviceWorker.ready.then((reg) => {
                    reg.active && reg.active.postMessage({
                        type: "SHOW_NOTIFICATION", title, body,
                        tag: opts.tag, icon: ICON_192_URI, data: opts.data
                    });
                    return true;
                }).catch(() => false);
            }

            async function ensureNotifPermission() {
                if (!("Notification" in window)) return false;
                if (Notification.permission === "granted") return true;
                if (Notification.permission === "denied") return false;
                try {
                    const res = await Notification.requestPermission();
                    return res === "granted";
                } catch (e) { return false; }
            }

            // ================= 공통 도구 =================
            const $ = (id) => document.getElementById(id);
            const container = $('mobile-container');
            const screenConsent = $('screen-consent');
            const screenTerms = $('screen-terms');
            const termsBody = $('terms-body');
            const lock = $('lock-screen');
            const overlay = $('black-overlay');
            const tapGuide = $('tap-guide');

            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            const nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
            const vibrate = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { } };

            let flowStarted = false;
            // 한 번 true 가 되면 설치 배너는 어떤 경로로도 다시 나타나지 않는다.
            let installBannerRetired = false;
            function retireInstallBanner() {
                installBannerRetired = true;
                const banner = $('install-banner');
                if (banner) {
                    banner.classList.remove('show');
                    banner.remove();
                }
            }

            // 검은 막. block=true 면 전환 중 탭이 아래 화면에 닿지 않게 막는다.
            function darken(v, ms, block) {
                overlay.style.transition = `opacity ${ms == null ? 1000 : ms}ms ease`;
                overlay.style.opacity = v;
                overlay.classList.toggle('block', !!block);
            }

            function showScreen(el) {
                [screenConsent, screenTerms].forEach((s) => s.classList.toggle('active', s === el));
                el.scrollTop = 0;
            }

            // 탭 대기. 안내 문구는 delay 뒤에 보여주고, auto 가 있으면 그 시간 뒤 자동 진행한다.
            function waitTap(el, opts) {
                opts = opts || {};
                return new Promise((resolve) => {
                    let done = false;
                    const finish = () => {
                        if (done) return;
                        done = true;
                        el.removeEventListener('click', finish);
                        clearTimeout(autoTimer);
                        clearTimeout(guideTimer);
                        tapGuide.classList.remove('show');
                        resolve();
                    };
                    const guideTimer = setTimeout(() => tapGuide.classList.add('show'), opts.guideDelay || 0);
                    const autoTimer = opts.auto ? setTimeout(finish, opts.auto) : null;
                    el.addEventListener('click', finish);
                });
            }

            // ---- iOS 알림창 ----
            const alertLayer = $('alert-layer');
            const alertCard = $('ios-alert');
            const alertYes = $('alert-yes');
            const alertNo = $('alert-no');
            const toast = $('alert-toast');

            let toastTimer = null;
            function showToast(text, ms) {
                toast.textContent = text;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), ms || 1800);
            }

            // 예/아니요 알림창. onNo 가 'block' 이면 아니요를 눌러도 닫히지 않는다(강제 동의).
            function ask(title, msg, opts) {
                opts = opts || {};
                $('alert-title').textContent = title;
                $('alert-msg').textContent = msg || '';
                alertLayer.classList.toggle('dark-bg', !!opts.clearBackdrop);
                alertLayer.classList.add('active');
                alertYes.disabled = alertNo.disabled = false;
                return nextFrame().then(() => {
                    alertLayer.classList.add('show');
                    return new Promise((resolve) => {
                        const close = (answer) => {
                            alertYes.onclick = alertNo.onclick = null;
                            alertYes.disabled = alertNo.disabled = true;
                            alertLayer.classList.remove('show');
                            setTimeout(() => {
                                alertLayer.classList.remove('active');
                                resolve(answer);
                            }, 260);
                        };
                        alertYes.onclick = () => { vibrate(20); close('yes'); };
                        alertNo.onclick = () => {
                            if (opts.onNo === 'block') {
                                vibrate([60, 40, 60]);
                                alertCard.classList.remove('shake');
                                void alertCard.offsetWidth;
                                alertCard.classList.add('shake');
                                if (opts.noToast) showToast(opts.noToast);
                                return;
                            }
                            close('no');
                        };
                    });
                });
            }

            // ---- 실제 기기 알림 (권한이 있을 때만, 사이트 연출과 같은 순간에 보낸다) ----
            let notifPermission = null;
            function pushReal(title, body, tag) {
                (notifPermission || Promise.resolve(false)).then((granted) => {
                    if (granted) sendNotification(title, body, { tag });
                });
            }

            // ================= 약관 조항 =================
            // 목록 항목(조항·잠금화면 알림·평가 항목)이 하나씩 나열되는 간격

            // 잠금화면을 위로 밀어 올려 연다 (터치·마우스 드래그, 휠, 키보드, 안내 문구 탭)
            function waitSwipeUp() {
                return new Promise((resolve) => {
                    let startY = null, lastY = 0, lastT = 0, vel = 0, done = false;
                    const h = () => lock.clientHeight || window.innerHeight;

                    const open = () => {
                        if (done) return;
                        done = true;
                        cleanup();
                        vibrate(15);
                        lock.classList.remove('dragging');
                        lock.classList.add('release');
                        lock.style.transform = 'translateY(-100%)';
                        lock.style.opacity = '0.4';
                        setTimeout(() => {
                            lock.classList.remove('active', 'release');
                            lock.style.transform = '';
                            lock.style.opacity = '';
                            resolve();
                        }, 470);
                    };
                    const down = (e) => {
                        startY = lastY = e.clientY;
                        lastT = performance.now();
                        vel = 0;
                        lock.classList.add('dragging');
                        try { lock.setPointerCapture(e.pointerId); } catch (err) { }
                    };
                    const move = (e) => {
                        if (startY == null) return;
                        const now = performance.now();
                        vel = (e.clientY - lastY) / Math.max(1, now - lastT);
                        lastY = e.clientY;
                        lastT = now;
                        const dy = Math.min(0, e.clientY - startY);
                        lock.style.transform = `translateY(${dy}px)`;
                        lock.style.opacity = String(1 - Math.min(.6, -dy / h()));
                    };
                    const up = (e) => {
                        if (startY == null) return;
                        const dy = e.clientY - startY;
                        startY = null;
                        lock.classList.remove('dragging');
                        // 탭(거의 안 움직임)이나 충분히 올린 경우 열린다
                        if (dy < -h() * 0.18 || vel < -0.6 || Math.abs(dy) < 6) { open(); return; }
                        lock.classList.add('release');
                        lock.style.transform = '';
                        lock.style.opacity = '';
                        setTimeout(() => lock.classList.remove('release'), 460);
                    };
                    const wheel = (e) => { if (e.deltaY > 25) open(); };
                    const key = (e) => {
                        if (['ArrowUp', ' ', 'Enter', 'PageDown'].includes(e.key)) { e.preventDefault(); open(); }
                    };
                    const cleanup = () => {
                        lock.removeEventListener('pointerdown', down);
                        lock.removeEventListener('pointermove', move);
                        lock.removeEventListener('pointerup', up);
                        lock.removeEventListener('pointercancel', up);
                        lock.removeEventListener('wheel', wheel);
                        window.removeEventListener('keydown', key);
                    };
                    lock.addEventListener('pointerdown', down);
                    lock.addEventListener('pointermove', move);
                    lock.addEventListener('pointerup', up);
                    lock.addEventListener('pointercancel', up);
                    lock.addEventListener('wheel', wheel, { passive: true });
                    window.addEventListener('keydown', key);
                });
            }

                    },
                    desktop: {
                        title: "앱으로 설치하기",
                        steps: [
                            "주소창 오른쪽의 설치 아이콘을 누르세요",
                            "또는 브라우저 메뉴에서 “앱으로 설치”를 선택하세요",
                            "“설치”를 누르면 완료예요"
                        ]
                    },
                    inAppIOS: {
                        title: "Safari에서 열어야 앱으로 설치할 수 있어요",
                        steps: [
                            "화면 구석의 메뉴 버튼을 탭하세요",
                            "“Safari로 열기”를 선택하세요",
                            "Safari에서 공유 → “홈 화면에 추가”"
                        ],
                        action: "링크 복사하기"
                    },
                    inAppAndroid: {
                        title: "다른 브라우저에서 열어야 앱으로 설치할 수 있어요",
                        steps: [
                            "아래 버튼으로 Chrome에서 열어주세요",
                            "Chrome 오른쪽 위 ⋮ 메뉴를 여세요",
                            "“앱 설치”를 선택하면 완료예요"
                        ],
                        action: "Chrome에서 열기"
                    }
                };

                let sheetActionKind = null;

                function openSheet(kind) {
                    const g = GUIDES[kind];
                    if (!g) return;
                    sheetActionKind = kind;
                    sheetTitle.textContent = g.title;
                    sheetSteps.innerHTML = "";
                    g.steps.forEach((s) => {
                        const li = document.createElement("li");
                        li.textContent = s;
                        sheetSteps.appendChild(li);
                    });
                    if (g.action) {
                        sheetAction.textContent = g.action;
                        sheetAction.classList.remove("hidden");
                    } else {
                        sheetAction.classList.add("hidden");
                    }
                    sheet.classList.add("show");
                    sheet.setAttribute("aria-hidden", "false");
                }

                function closeSheet() {
                    sheet.classList.remove("show");
                    sheet.setAttribute("aria-hidden", "true");
                }

                sheetClose.addEventListener("click", closeSheet);
                sheetBackdrop.addEventListener("click", closeSheet);

                sheetAction.addEventListener("click", async () => {
                    if (sheetActionKind === "inAppAndroid") {
                        // 인앱 브라우저에서 Chrome 으로 탈출 (안드로이드 인텐트)
                        const scheme = location.protocol.replace(":", "");
                        window.location.href = "intent://" + location.host + location.pathname + location.search +
                            "#Intent;scheme=" + scheme + ";package=com.android.chrome;end";
                        return;
                    }
                    // iOS 인앱 브라우저는 프로그램적으로 Safari 를 열 수 없어 링크 복사로 대체
                    const url = location.href;
                    let ok = false;
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(url);
                            ok = true;
                        }
                    } catch (e) { ok = false; }
                    if (!ok) {
                        try {
                            const ta = document.createElement("textarea");
                            ta.value = url;
                            ta.setAttribute("readonly", "");
                            ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
                            document.body.appendChild(ta);
                            ta.select();
                            ta.setSelectionRange(0, url.length);
                            ok = document.execCommand("copy");
                            document.body.removeChild(ta);
                        } catch (e) { ok = false; }
                    }
                    sheetAction.textContent = ok ? "복사했어요 ✓" : "주소창의 링크를 복사해주세요";
                });

                // ---- beforeinstallprompt ----
                // 이 이벤트는 배너를 띄운 뒤에 도착할 수도 있으므로 대기열을 둔다.
                let deferredPrompt = null;
                let promptWaiters = [];

                window.addEventListener("beforeinstallprompt", (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    const waiters = promptWaiters;
                    promptWaiters = [];
                    waiters.forEach((fn) => fn(e));
                    showBanner(); // 뒤늦게 설치 가능해진 경우에도 배너를 노출
                });

                window.addEventListener("appinstalled", markInstalled);

                function waitForPrompt(ms) {
                    if (deferredPrompt) return Promise.resolve(deferredPrompt);
                    return new Promise((resolve) => {
                        const onEvt = (e) => { clearTimeout(timer); resolve(e); };
                        const timer = setTimeout(() => {
                            promptWaiters = promptWaiters.filter((f) => f !== onEvt);
                            resolve(null);
                        }, ms);
                        promptWaiters.push(onEvt);
                    });
                }

                // ---- 배너 ----
                function showBanner() {
                    if (installBannerRetired) return; // 영구 제거 상태면 어떤 조건에서도 노출 안 함
                    if (flowStarted) return;
                    if (isInstalled()) return;
                    if (inApp) {
                        ibTitle.textContent = "브라우저에서 열어주세요";
                        ibSub.textContent = isIOS
                            ? "Safari로 열면 설치돼요"
                            : "Chrome으로 열면 설치돼요";
                        ibInstall.textContent = "방법 보기";
                    } else {
                        ibTitle.textContent = "앱으로 설치하기";
                        ibSub.textContent = (window.Notification && Notification.permission === "granted")
                            ? "언제든 다시 볼 수 있어요"
                            : "설치하고 알림도 받아보세요";
                    }
                    banner.classList.add("show");
                    banner.setAttribute("aria-hidden", "false");
                }

                ibInstall.addEventListener("click", async () => {
                    // 인앱 브라우저 / iOS 는 네이티브 설치 프롬프트가 없으므로 안내 시트로 보낸다
                    if (inApp) {
                        openSheet(isIOS ? "inAppIOS" : "inAppAndroid");
                        retireInstallBanner();
                        return;
                    }
                    if (isIOS) {
                        openSheet("ios");
                        retireInstallBanner();
                        return;
                    }

                    // beforeinstallprompt 가 아직 도착하지 않았을 수 있으니 잠깐 기다린다.
                    // (사용자 제스처 유효시간 5초 안쪽이라 이후 prompt() 호출이 유지된다)
                    ibInstall.disabled = true;
                    const prompt = deferredPrompt || await waitForPrompt(2000);
                    ibInstall.disabled = false;

                    if (prompt) {
                        deferredPrompt = null;
                        try {
                            prompt.prompt();
                            const choice = await prompt.userChoice;
                            if (choice && choice.outcome === "accepted") markInstalled();
                            else retireInstallBanner(); // 취소해도 배너는 다시 노출하지 않음
                        } catch (e) {
                            retireInstallBanner();
                        }
                    } else {
                        // 설치 조건 미충족이거나 지원하지 않는 브라우저 -> alert 대신 시트로 안내
                        openSheet(isAndroid ? "android" : "desktop");
                        retireInstallBanner();
                    }
                });

                ibClose.addEventListener("click", retireInstallBanner);

                if (isInstalled()) retireInstallBanner();
                else setTimeout(showBanner, 1200);
            })();

        })();
    </script>
</body>

</html>
